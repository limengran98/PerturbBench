[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-response"
version = "0.1.0"
description = "Minimal reproducible baseline-aware intervention response modeling."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
scperturb = [
  "h5py>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
