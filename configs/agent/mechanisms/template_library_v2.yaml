templates:
  - name: baseline_identity_skip
    priority_base: 3.0
    preferred_dataset_tags:
      - single_cell
      - matched_control
      - patient_paired
    preferred_paths:
      - representation.prediction.baseline_skip
      - representation.prediction.target
      - representation.prediction.zero_init_head
    action_families:
      - mechanism
    preferred_task_groups:
      - single_cell
      - paired_clinical
    hypothesis: Preserve baseline state as an explicit identity path and model perturbation effects as anchored residual deviations.
    risks:
      - Can underfit when post-state is far from baseline.
  - name: delta_vs_direct_response
    priority_base: 3.0
    preferred_dataset_tags:
      - single_cell
      - dose_time
      - patient_paired
      - drug_profile
    preferred_paths:
      - representation.prediction.target
      - representation.loss.delta_weight
      - representation.loss.response_weight
    action_families:
      - mechanism
      - optimization
    preferred_task_groups:
      - dose_time
      - paired_clinical
    hypothesis: Some perturbation tasks should be modeled as baseline-relative deltas, while others require direct post-state prediction.
    risks:
      - Loss changes can drift into objective tuning if detached from a mechanistic claim.
  - name: conditioning_operator
    priority_base: 2.75
    preferred_dataset_tags:
      - context_rich
      - dose_time
      - drug_profile
      - single_cell
    preferred_paths:
      - representation.conditioning.mode
      - representation.conditioning.conditioning_dim
    action_families:
      - mechanism
    preferred_task_groups:
      - dose_time
      - paired_clinical
      - multimodal
    hypothesis: Perturbation and context signals should enter through an explicit conditioning operator rather than being treated as unstructured metadata.
    risks:
      - Overly expressive conditioning can hide the role of baseline state.
  - name: residual_refinement
    priority_base: 2.0
    preferred_dataset_tags:
      - single_cell
      - drug_profile
      - patient_paired
    preferred_paths:
      - representation.trunk.residual_depth
      - representation.trunk.trunk_depth
    action_families:
      - capacity
    preferred_task_groups:
      - single_cell
      - paired_clinical
    hypothesis: Response formation may require iterative residual refinement instead of a single shallow mapping.
    risks:
      - Excess depth may destabilize training on smaller datasets.
  - name: trunk_capacity
    priority_base: 1.25
    preferred_dataset_tags:
      - high_dimensional
      - drug_profile
      - single_cell
    preferred_paths:
      - representation.trunk.hidden_dim
      - representation.trunk.trunk_depth
    action_families:
      - capacity
    preferred_task_groups:
      - dose_time
      - paired_clinical
    hypothesis: Different perturbation datasets require different representational capacity to capture response manifolds.
    risks:
      - Pure capacity changes can become weakly mechanistic if overused.
  - name: se_channel_reweighting
    priority_base: 1.5
    preferred_dataset_tags:
      - high_dimensional
      - drug_profile
      - single_cell
    preferred_paths:
      - representation.trunk.use_se_block
      - representation.trunk.se_reduction
    action_families:
      - capacity
    preferred_task_groups:
      - dose_time
      - multimodal
    hypothesis: Feature channels may benefit from perturbation-aware recalibration under high-dimensional biological readouts.
    risks:
      - Adds complexity with limited interpretability if selected too often.
  - name: zero_init_stabilization
    priority_base: 2.5
    preferred_dataset_tags:
      - matched_control
      - sparse_effect
      - single_cell
    preferred_paths:
      - representation.prediction.zero_init_head
      - representation.prediction.baseline_skip
    action_families:
      - mechanism
    preferred_task_groups:
      - single_cell
      - paired_clinical
    hypothesis: Initialize perturbation-effect predictions near zero to encode a biologically plausible near-no-effect prior.
    risks:
      - May slow learning when strong perturbation effects dominate.
  - name: loss_mixing
    priority_base: 1.25
    preferred_dataset_tags:
      - dose_time
      - patient_paired
      - drug_profile
    preferred_paths:
      - representation.loss.delta_weight
      - representation.loss.response_weight
    action_families:
      - optimization
      - mechanism
    preferred_task_groups:
      - dose_time
      - paired_clinical
    hypothesis: Some tasks require balancing baseline-relative delta fidelity against direct post-state fidelity.
    risks:
      - Can become reward-focused if used without an accompanying structural claim.
