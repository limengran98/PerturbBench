name: mechanism_fidelity_structured_search_v2
objective_path: val.delta.mse
llm_required: true
proposal_attempts_per_iteration: 5
beam_width: 3
template_priority_top_k: 6
rejection_memory_window: 6
priority_boost_unexplored_axis: 2.5
priority_penalty_repeated_axis: 1.0
priority_boost_dataset_tag: 3.0
priority_boost_editable_path: 0.5
priority_penalty_recent_rejection: 2.0
priority_boost_current_ir_affinity: 0.75
priority_boost_positive_outcome: 4.0
priority_penalty_negative_outcome: 2.5
priority_boost_cross_dataset_memory: 3.5
cross_dataset_memory_enabled: true
cross_dataset_memory_roots:
  - agent_runs
  - agent_runs_v2
cross_dataset_memory_min_similarity: 0.3
cross_dataset_memory_top_k: 6
max_edits_per_proposal: 2
allow_optimizer_only_change: false
allow_no_structural_change_for_iteration0: true
stage1_fraction: 0.6
stage1_allowed_action_families:
  - mechanism
  - capacity
stage2_allowed_action_families:
  - mechanism
  - capacity
  - optimization
counterfactual_checks_enabled: true
counterfactual_major_penalty: 3.0
counterfactual_minor_penalty: 1.0
counterfactual_pass_bonus: 1.5
beam_template_rank_bonus: 0.75
beam_memory_bonus_scale: 1.25
beam_edit_size_penalty: 0.15
beam_llm_proposal_bonus: 0.1
forbidden_behaviors:
  - free-form code generation
  - changing dataset or split semantics
  - changing evaluation metrics
  - editing unrelated implementation details
  - reward hacking through execution-only changes
allowed_primitives:
  - set_scalar
  - toggle_boolean
  - scale_numeric
  - increment
  - cycle_enum
