name: structured_hypothesis
hidden_dim: 192
trunk_depth: 2
residual_depth: 1
use_se_block: false
se_reduction: 4
conditioning_mode: film
conditioning_dim: 128
predict_target: delta
baseline_skip: true
zero_init_head: false
response_loss_weight: 0.25
delta_loss_weight: 1.0
epochs: 220
batch_size: 128
eval_batch_size: 128
learning_rate: 0.0006
weight_decay: 0.00015
patience: 30
max_grad_norm: 1.0
use_lr_scheduler: true
scheduler_factor: 0.5
scheduler_patience: 8
scheduler_min_lr: 1.0e-5
min_delta: 1.0e-4
divergence_ratio: 1.75
divergence_patience: 6
dropout: 0.05
