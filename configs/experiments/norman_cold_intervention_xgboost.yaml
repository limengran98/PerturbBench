run_name: norman_cold_intervention_xgboost
seed: 11
artifacts_root: ../../artifacts
dataset_config: ../datasets/norman_scperturb.yaml
split_path: ../../splits/norman/cold_intervention/seed11.json
baseline:
  name: xgboost
  feature_builder:
    intervention_hash_dim: 64
  tuning_budget:
    definition: fixed_default_v1
    num_trials: 1
  params:
    n_estimators: 32
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: 4
metrics:
  top_k: 20
notes: Minimal universal XGBoost baseline on Norman cold_intervention.
